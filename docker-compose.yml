# Painel v2 em produção (AWS Lightsail, mesmo servidor do painel v1). Rodar a partir de /opt/kavria2:
#   sudo docker compose --env-file server.env up -d --build
# Não tem Caddy próprio: entra na rede do painel v1 (kavria_default) e o Caddy do v1 atende
# painel2.kavria.com.br encaminhando para kavria2-app:8000 (HTTPS automático lá).
services:
  app:
    build: .
    image: kavria-painel-v2
    container_name: kavria2-app
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_BASE_URL: "https://${DOMAIN:?defina DOMAIN em server.env}"
      DATABASE_URL: "sqlite+aiosqlite:///./data/kavria2.db"
      WORKERS_ENABLED: "true"
    volumes:
      - ./data:/app/backend/data
    expose:
      - "8000"
    networks:
      - kavria
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  kavria:
    external: true
    name: kavria_default
